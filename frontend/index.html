<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#020617" />
    <script>
      // Set the saved theme before styles render to prevent a light/dark flash.
      try {
        if (localStorage.getItem('promptiq_theme') === 'light') {
          document.documentElement.classList.replace('dark', 'light');
          document.documentElement.style.colorScheme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#f8fafc';
        }
      } catch (_) { /* A disabled storage API should not block rendering. */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptIQ — Deep Learning-Based Prompt Quality Assessment and Improvement System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-navy-950 text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
